<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1200" viewBox="0 0 3200 1200" font-family="Arial, sans-serif">
  <!-- Шаблон баннера профиля FunPay Plus, 3200×1200 (8:3).
       Баннер растягивается по ширине окна и прижимается к низу, поэтому верх почти не виден. -->
  <rect width="3200" height="1200" fill="#1b1d2a"/>

  <!-- Не видно на обычных экранах -->
  <rect width="3200" height="560" fill="#3a1d26"/>
  <text x="1600" y="300" fill="#ff8a9a" font-size="64" text-anchor="middle">Почти не видно: только на узких окнах</text>

  <!-- Видно на всех экранах -->
  <rect y="700" width="3200" height="500" fill="#1d3a2c"/>
  <text x="1600" y="770" fill="#7dffb6" font-size="56" text-anchor="middle">Видно всегда: нижние 500 px</text>

  <!-- Шапка сайта поверх баннера -->
  <rect y="560" width="3200" height="140" fill="#2a2d40"/>
  <text x="1600" y="645" fill="#c8cbe0" font-size="48" text-anchor="middle">Видно на окнах до ~1600 px</text>

  <!-- Безопасная зона по ширине: контент FunPay ~1170 px из 1920 -->
  <rect x="625" y="700" width="1950" height="500" fill="none" stroke="#ffd166" stroke-width="8" stroke-dasharray="40 20"/>
  <text x="1600" y="1150" fill="#ffd166" font-size="48" text-anchor="middle">Главное держите здесь: 1950×500 по центру</text>

  <!-- Аватар и ник накрывают низ слева -->
  <circle cx="790" cy="1130" r="190" fill="none" stroke="#8ab4f8" stroke-width="8"/>
  <text x="790" y="1000" fill="#8ab4f8" font-size="40" text-anchor="middle">аватар</text>
</svg>
